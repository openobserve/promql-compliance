services:
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    network_mode: bridge
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - prometheus-volume:/prometheus
      - ./prometheus-test-data.yml:/etc/prometheus/prometheus.yml
volumes:
  prometheus-volume:
